<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>冲绳海洋发现岛</title>
<meta name="description" content="在冲绳的海里真实遇见它们，每发现一种就点亮一张卡。">
<style>
  :root {
    color-scheme: light;
    --paper: #fffdf7;
    --wash: #f3fbfa;
    --wash-strong: #e2f4f1;
    --ink: #25333a;
    --muted: #657981;
    --line: #cfe3df;
    --accent: #f08f79;
    --accent-dark: #ba5f50;
    --sun: #f8ca6a;
    --card: rgba(255,255,255,.88);
    --shadow: 0 18px 42px rgba(57, 98, 105, .14);
    --radius: 8px;
    --font: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
    --serif: Georgia, "Songti SC", serif;
  }

  * { box-sizing: border-box; }
  html { min-width: 320px; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 231, 186, .55), transparent 30%),
      linear-gradient(180deg, #f7fffd 0%, #fffdf8 48%, #f2fbf7 100%);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.55;
  }

  button {
    font: inherit;
  }

  .page {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 20px 16px 34px;
  }

  .hero {
    padding: 14px 0 18px;
  }

  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .brand-mark::before {
    content: "";
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 56% 42%, #fff 0 16%, transparent 17%),
      linear-gradient(140deg, #8fd6d0, #f7c56f);
    border: 1px solid rgba(93, 139, 139, .26);
  }

  .lang-switch {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
  }

  .lang-switch button,
  .plain-btn {
    border: 1px solid var(--line);
    background: rgba(255,255,255,.78);
    color: var(--muted);
    border-radius: 999px;
    min-height: 36px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .lang-switch button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: white;
  }

  .hero-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255,255,255,.72);
    box-shadow: var(--shadow);
    padding: clamp(18px, 4vw, 34px);
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(34px, 7vw, 68px);
    line-height: 1.04;
    letter-spacing: 0;
  }

  .lead {
    max-width: 680px;
    margin: 16px 0 0;
    color: var(--muted);
    font-size: clamp(15px, 2.3vw, 18px);
  }

  .progress-box {
    width: min(270px, 100%);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 10px;
  }

  .progress-count {
    color: var(--ink);
    font-weight: 800;
  }

  .progress-track {
    height: 12px;
    border-radius: 999px;
    background: #e6efed;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, #7ed3cf, var(--sun), var(--accent));
    transition: width .25s ease;
  }

  .celebration {
    display: none;
    margin-top: 14px;
    border: 1px solid #f2d3a6;
    background: #fff7df;
    border-radius: var(--radius);
    padding: 12px 14px;
    color: #805b20;
    font-weight: 700;
  }

  .celebration.show {
    display: block;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-top: 18px;
  }

  .card {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: 0 10px 24px rgba(58, 105, 110, .1);
    padding: 10px;
  }

  .rarity {
    position: absolute;
    z-index: 2;
    right: 10px;
    top: 10px;
    min-width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(96, 134, 132, .28);
    color: var(--accent-dark);
    font-weight: 900;
  }

  .image-button {
    position: relative;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    width: 100%;
    padding: 0;
    border: 0;
    border-radius: var(--radius);
    background: var(--wash);
    cursor: pointer;
  }

  .image-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1) contrast(.92);
    opacity: .38;
    transform: scale(1.01);
    transition: filter .22s ease, opacity .22s ease, transform .22s ease;
  }

  .card.found .image-button img {
    filter: none;
    opacity: 1;
  }

  .image-button:hover img,
  .image-button:focus-visible img {
    transform: scale(1.035);
  }

  .silhouette {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(37, 51, 58, .58);
    font-size: clamp(36px, 8vw, 54px);
    font-weight: 900;
    letter-spacing: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(119, 149, 151, .16));
    pointer-events: none;
  }

  .card.found .silhouette {
    opacity: 0;
  }

  .badge {
    position: absolute;
    left: 10px;
    top: 10px;
    z-index: 2;
    display: none;
    border: 1px solid rgba(186, 95, 80, .3);
    background: #fff9f2;
    color: var(--accent-dark);
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 800;
  }

  .card.found .badge {
    display: inline-block;
  }

  .card-title {
    min-width: 0;
  }

  .card-title h2 {
    margin: 0;
    font-size: clamp(15px, 2.6vw, 20px);
    line-height: 1.25;
    letter-spacing: 0;
    overflow-wrap: anywhere;
  }

  .card-title p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .discover-btn {
    width: 100%;
    min-height: 42px;
    border: 1px solid rgba(126, 211, 207, .7);
    background: var(--wash-strong);
    color: #27545a;
    border-radius: var(--radius);
    font-weight: 900;
    cursor: pointer;
  }

  .card.found .discover-btn {
    border-color: rgba(240, 143, 121, .55);
    background: #fff3ea;
    color: var(--accent-dark);
  }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(31, 48, 54, .48);
  }

  .modal.open {
    display: flex;
  }

  .dialog {
    width: min(840px, 100%);
    max-height: min(720px, 92vh);
    display: grid;
    grid-template-columns: minmax(0, .95fr) minmax(0, 1fr);
    gap: 18px;
    overflow: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 24px 70px rgba(22, 42, 48, .35);
  }

  .detail-image {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--wash);
  }

  .detail-image img {
    width: 100%;
    height: 100%;
    min-height: 320px;
    object-fit: cover;
  }

  .detail-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    padding: 4px 2px 2px;
  }

  .dialog-head {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
  }

  .dialog h2 {
    margin: 0;
    font-size: clamp(24px, 4vw, 36px);
    line-height: 1.12;
    letter-spacing: 0;
  }

  .close-btn {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: #fff;
    color: var(--ink);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .detail-num {
    color: var(--muted);
    font-weight: 800;
    font-size: 13px;
  }

  .fact {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: var(--radius);
    padding: 12px;
  }

  .fact b {
    display: block;
    margin-bottom: 4px;
    color: #3e6d70;
    font-size: 13px;
  }

  .fact p {
    margin: 0;
    color: var(--ink);
  }

  .detail-actions {
    margin-top: auto;
  }

  .detail-actions .discover-btn {
    max-width: 260px;
  }

  @media (max-width: 760px) {
    .hero-main {
      grid-template-columns: 1fr;
    }

    .progress-box {
      width: 100%;
    }

    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      padding: 8px;
      gap: 8px;
    }

    .dialog {
      grid-template-columns: 1fr;
    }

    .detail-image img {
      min-height: auto;
      aspect-ratio: 4 / 5;
    }
  }

  @media (max-width: 390px) {
    .page {
      padding-left: 10px;
      padding-right: 10px;
    }

    .topline {
      align-items: flex-start;
      flex-direction: column;
    }

    .lang-switch {
      justify-content: flex-start;
    }

    .grid {
      gap: 8px;
    }

    .card {
      padding: 7px;
    }

    .discover-btn {
      min-height: 40px;
      padding: 4px 6px;
      font-size: 13px;
    }
  }
</style>
</head>

  </article>
</div>

    },
    zhTW: {
      htmlLang: "zh-Hant",
      brand: "試用頁",
      title: "沖繩海洋發現島",
      lead: "在沖繩的海裡真實遇見牠們，每發現一種就點亮一張卡。",
      progressLabel: "收集進度",
      progressText: "已發現 {n} / {total}",
      foundBadge: "已發現",
      discover: "發現了！",
      undo: "取消發現",
      openCard: "打開卡片",
      introLabel: "認識牠",
      whereLabel: "在哪裡找",
      missionLabel: "小任務",
      celebration: "全部發現！你完成了沖繩海洋小小觀察員任務。",
      close: "關閉"
    },
    ja: {
      htmlLang: "ja",
      brand: "おためしページ",
      title: "沖縄 海の発見島",
      lead: "沖縄の海で本当に出会える生きものたち。見つけるたびにカードをひとつ光らせよう。",
      progressLabel: "あつめた数",
      progressText: "{n} / {total} 見つけた",
      foundBadge: "発見",
      discover: "見つけた！",
      undo: "発見を取り消す",
      openCard: "カードを開く",
      introLabel: "どんな生きもの？",
      whereLabel: "どこで見つかる？",
      missionLabel: "ミッション",
      celebration: "ぜんぶ発見！沖縄の海の小さな観察員ミッションをクリアしました。",
      close: "閉じる"
    },
    en: {
      htmlLang: "en",
      brand: "Trial page",
      title: "Okinawa Ocean Discovery Island",
      lead: "Meet them for real in Okinawa's sea. Light up one card each time you find a species.",
      progressLabel: "Collection progress",
      progressText: "Found {n} / {total}",
      foundBadge: "Found",
      discover: "Found it!",
      undo: "Undo found",
      openCard: "Open card",
      introLabel: "Meet it",
      whereLabel: "Where to look",
      missionLabel: "Mission",
      celebration: "All found! You completed the little Okinawa ocean observer mission.",
      close: "Close"
    }
  };

  let data = JSON.parse(document.getElementById("cards-data").textContent);
  let lang = getInitialLang();
  let found = loadFound();
  let activeId = null;

  const grid = document.getElementById("cardGrid");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  const celebration = document.getElementById("celebration");
  const modal = document.getElementById("modal");
  const closeModal = document.getElementById("closeModal");
  const detailImg = document.getElementById("detailImg");
  const detailNum = document.getElementById("detailNum");
  const detailTitle = document.getElementById("detailTitle");
  const detailIntro = document.getElementById("detailIntro");
  const detailWhere = document.getElementById("detailWhere");
  const detailMission = document.getElementById("detailMission");
  const detailToggle = document.getElementById("detailToggle");

  applyLanguage();
  renderCards();
  updateProgress();

  document.querySelectorAll("[data-lang]").forEach((button) => {
    button.addEventListener("click", () => {
      lang = button.dataset.lang;
      localStorage.setItem(LANG_KEY, toStoredLang(lang));
      applyLanguage();
      renderCards();
      updateProgress();
      if (activeId) {
        openDetail(activeId);
      }
    });
  });

  closeModal.addEventListener("click", hideModal);
  modal.addEventListener("click", (event) => {
    if (event.target === modal) hideModal();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && modal.classList.contains("open")) hideModal();
  });
  detailToggle.addEventListener("click", () => {
    if (activeId) toggleFound(activeId);
  });

  function getInitialLang() {
    const stored = normalizeLang(localStorage.getItem(LANG_KEY));
    if (stored) return stored;
    const params = new URLSearchParams(location.search);
    const fromUrl = normalizeLang(params.get("lang") || params.get("ui"));
    if (fromUrl) return fromUrl;
    const nav = navigator.languages || [navigator.language || ""];
    for (const tag of nav) {
      const mapped = normalizeLang(tag);
      if (mapped) return mapped;
      if (tag) return "en";
    }
    return "en";
  }

  function normalizeLang(value) {
    const tag = String(value || "").toLowerCase();
    if (/^zh-(tw|hant|hk|mo)(-|$)/.test(tag)) return "zhTW";
    if (/^zh-tw$/.test(tag)) return "zhTW";
    if (/^zh($|-cn|-hans|-sg)/.test(tag)) return "zh";
    if (/^ja($|-)/.test(tag)) return "ja";
    if (/^en($|-)/.test(tag)) return "en";
    if (LANGS.includes(value)) return value;
    return "";
  }

  function toStoredLang(value) {
    return value === "zhTW" ? "zh-tw" : value;
  }

  function loadFound() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return new Set(Array.isArray(saved) ? saved : []);
    } catch {
      return new Set();
    }
  }

  function saveFound() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...found]));
  }

  function t(key) {
    return i18n[lang][key];
  }

  function applyLanguage() {
    document.documentElement.lang = t("htmlLang");
    document.title = t("title");
    document.querySelector('meta[name="description"]').setAttribute("content", t("lead"));
    document.querySelectorAll("[data-i18n]").forEach((node) => {
      node.textContent = t(node.dataset.i18n);
    });
    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
    });
    closeModal.setAttribute("aria-label", t("close"));
  }

  function renderCards() {
    if (!data) return;
    grid.innerHTML = "";
    data.species.forEach((species) => {
      const isFound = found.has(species.id);
      const card = document.createElement("article");
      card.className = `card${isFound ? " found" : ""}`;
      card.dataset.id = species.id;
      card.innerHTML = `
        <span class="rarity" aria-label="rarity">${species.rarity}</span>
        <button type="button" class="image-button" aria-label="${t("openCard")}: ${escapeHtml(species.name[lang])}">
          <img src="${species.img}" alt="${escapeHtml(species.name[lang])}" loading="lazy">
          <span class="silhouette" aria-hidden="true">${species.num}</span>
          <span class="badge">${t("foundBadge")}</span>
        </button>
        <div class="card-title">
          <h2>${escapeHtml(species.name[lang])}</h2>
          <p>${species.num}</p>
        </div>
        <button type="button" class="discover-btn">${isFound ? t("undo") : t("discover")}</button>
      `;
      card.querySelector(".image-button").addEventListener("click", () => openDetail(species.id));
      card.querySelector(".discover-btn").addEventListener("click", () => toggleFound(species.id));
      grid.appendChild(card);
    });
  }

  function toggleFound(id) {
    if (found.has(id)) {
      found.delete(id);
    } else {
      found.add(id);
    }
    saveFound();
    renderCards();
    updateProgress();
    if (activeId) {
      openDetail(activeId);
    }
  }

  function updateProgress() {
    if (!data) return;
    const total = data.species.length;
    const count = data.species.filter((species) => found.has(species.id)).length;
    progressText.textContent = t("progressText").replace("{n}", count).replace("{total}", total);
    progressFill.style.width = `${(count / total) * 100}%`;
    celebration.classList.toggle("show", count === total);
  }

  function openDetail(id) {
    const species = data.species.find((item) => item.id === id);
    if (!species) return;
    activeId = id;
    detailImg.src = species.img;
    detailImg.alt = species.name[lang];
    detailNum.textContent = `${species.num} ${species.rarity}`;
    detailTitle.textContent = species.name[lang];
    detailIntro.textContent = species.intro[lang];
    detailWhere.textContent = species.where[lang];
    detailMission.textContent = species.mission[lang];
    detailToggle.textContent = found.has(id) ? t("undo") : t("discover");
    modal.classList.add("open");
    closeModal.focus();
  }

  function hideModal() {
    modal.classList.remove("open");
    activeId = null;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>
</body>
</html>
